name: Corpus validation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Formatter preservation tests
        run: python -m unittest discover -s tests -v
      - name: Notebook structure and code syntax
        run: python scripts/check_training_notebook.py
      - name: Dataset hashes, split separation and deterministic rebuild
        run: python scripts/audit_corpus.py

  notebook-smoke:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      MPLBACKEND: Agg
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.4,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install notebook runtime and Jupyter test dependencies
        run: python -m pip install -r notebooks/requirements-test.txt
      - name: Execute notebook with two CPU optimizer updates
        run: python scripts/check_training_notebook.py --smoke
